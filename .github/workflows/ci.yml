name: CI Hardening & Optimization Suite

on:
  push:
    branches: [main, hardening-and-optimization]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality, Tests & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Unit & Distribution Tests (Vitest)
        run: npm run test

      - name: Production Build (Vite)
        run: npm run build

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
