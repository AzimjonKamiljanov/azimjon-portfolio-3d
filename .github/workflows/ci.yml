name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, format & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Static analysis (ESLint)
        run: npm run lint

      - name: Production build (Vite)
        run: npm run build

      - name: Unit & dist tests (Vitest)
        run: npm run test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Visual regression baselines are recorded on the author's machine and
      # do not survive a different OS/GPU, so they run in their own advisory
      # job below instead of gating the merge.
      - name: Functional E2E
        run: npx playwright test --grep-invert @visual
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Visual snapshots
        run: npx playwright test --grep @visual
        env:
          CI: "true"

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7

  budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Lighthouse is deliberately not used here. The page runs a continuous
      # requestAnimationFrame loop, so Lighthouse's load model never sees the
      # CPU go idle and the run does not terminate -- measured locally: no
      # result after 400 s. A runner also has no GPU, so any frame rate it
      # reported would measure SwiftShader rather than the site. Transfer
      # size is the part of performance that is deterministic here, and the
      # part that regresses silently when a dependency is added.
      - name: First-view transfer budget
        run: npm run budget

  security:
    name: Dependency audit & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs the full history, not just the tip commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      # Pinned by digest-free tag on the official image: no action licence
      # needed and no reliance on the tool being preinstalled on the runner.
      - name: Gitleaks full-history scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json \
            --exit-code 0

      # Fails the job on any finding, and also if no report was written at all
      # (a crashed scanner must not read as a clean tree).
      - name: Enforce secret-scan result
        env:
          GITLEAKS_EXPECT_REPORT: "1"
        run: node scripts/report-gitleaks.cjs
