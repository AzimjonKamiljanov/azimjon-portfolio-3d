<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0c1e"/>
      <stop offset="70%" stop-color="#03040c"/>
      <stop offset="100%" stop-color="#010106"/>
    </radialGradient>
    
    <!-- Radiant Sun / Core Gradient -->
    <radialGradient id="sunCore" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff1a8"/>
      <stop offset="55%" stop-color="#ffaa00"/>
      <stop offset="85%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#991100"/>
    </radialGradient>

    <!-- Outer Corona Glow -->
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff6600" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#ff2200" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Saturn Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#fff2a8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#e6b800" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#c68a00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#664400" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Space Badge Background -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#ffaa00" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Background Ambient Stars -->
  <circle cx="28" cy="30" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="102" cy="24" r="1.5" fill="#aaccff" opacity="0.9"/>
  <circle cx="96" cy="98" r="1" fill="#ffeaa7" opacity="0.75"/>
  <circle cx="24" cy="94" r="1.3" fill="#ffffff" opacity="0.8"/>
  <circle cx="48" cy="18" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="108" cy="66" r="0.9" fill="#ffffff" opacity="0.7"/>

  <!-- Corona Aura -->
  <circle cx="64" cy="64" r="44" fill="url(#coronaGlow)"/>

  <!-- Saturn Tilted Back Ring Arc -->
  <g transform="rotate(-26 64 64)">
    <ellipse cx="64" cy="64" rx="55" ry="16" fill="none" stroke="url(#ringGrad)" stroke-width="6.5" opacity="0.92"/>
    <ellipse cx="64" cy="64" rx="51" ry="14" fill="none" stroke="#ffeaa7" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Central Radiant Star / Sun Body -->
  <circle cx="64" cy="64" r="27" fill="url(#sunCore)" filter="url(#solarGlow)"/>

  <!-- Saturn Front Ring Crossing (Half Cut to wrap around foreground) -->
  <g transform="rotate(-26 64 64)" clip-path="url(#frontClip)">
    <clipPath id="frontClip">
      <rect x="0" y="64" width="128" height="64"/>
    </clipPath>
    <ellipse cx="64" cy="64" rx="55" ry="16" fill="none" stroke="url(#ringGrad)" stroke-width="6.5"/>
    <ellipse cx="64" cy="64" rx="51" ry="14" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Corona Flares & Diamond Twinkle -->
  <polygon points="64,12 66.5,24 64,22 61.5,24" fill="#ffffff" opacity="0.9"/>
  <polygon points="64,116 66.5,104 64,106 61.5,104" fill="#ffffff" opacity="0.9"/>
  <polygon points="12,64 24,66.5 22,64 24,61.5" fill="#ffffff" opacity="0.9"/>
  <polygon points="116,64 104,66.5 106,64 104,61.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" opacity="0.9"/>
</svg>
